<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="1200" height="360" role="img" aria-label="Adrian Doria. Entendo o negócio. Automatizo o trabalho. Negócio, Dados, Automação e IA.">
<defs>
  <pattern id="dots" width="18" height="18" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.2" fill="#9fd6f2" fill-opacity=".16"/></pattern>
  <radialGradient id="fade" cx="78%" cy="50%" r="55%"><stop offset="0" stop-color="#fff"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient>
  <mask id="m"><rect width="1200" height="360" fill="url(#fade)"/></mask>
</defs>
<style>
  text { font-family: 'Segoe UI', 'Helvetica Neue', Arial, sans-serif; }
  .node { opacity: 0; animation: in .8s cubic-bezier(.16,1,.3,1) forwards; }
  .ok { opacity: 0; transform-box: fill-box; transform-origin: center; animation: pop .5s cubic-bezier(.16,1,.3,1) forwards; }
  .wire { animation: draw .6s ease-out forwards; }
  .pulse { opacity: 0; animation: run 1.8s ease-in-out infinite; }
  .t1 { opacity: 0; animation: in .9s cubic-bezier(.16,1,.3,1) .05s forwards; }
  .t2 { opacity: 0; animation: in .9s cubic-bezier(.16,1,.3,1) .2s forwards; }
  @keyframes in { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
  @keyframes pop { from { opacity: 0; transform: scale(.4); } to { opacity: 1; transform: none; } }
  @keyframes draw { to { stroke-dashoffset: 0; } }
  @keyframes run { 0% { opacity: 0; transform: translateX(0); } 15% { opacity: 1; } 85% { opacity: 1; } 100% { opacity: 0; transform: translateX(var(--dx)); } }
  @media (prefers-reduced-motion: reduce) { .node, .ok, .t1, .t2 { animation: none; opacity: 1; } .wire { animation: none; stroke-dashoffset: 0; } .pulse { display: none; } }
</style>
<rect width="1200" height="360" rx="24" fill="#0b0f15"/>
<rect width="1200" height="360" fill="url(#dots)" mask="url(#m)"/>
<g class="t1"><text x="56" y="150" font-size="56" font-weight="700" letter-spacing="-1.6" fill="#eef3f8">Adrian Doria</text></g>
<g class="t2">
  <text x="58" y="198" font-size="24" fill="#a2afc2">Entendo o negócio.</text>
  <text x="58" y="230" font-size="24" font-weight="600" fill="#eef3f8">Automatizo o trabalho.</text>
  <rect x="58" y="258" width="300" height="30" rx="15" fill="#13283a"/>
  <text x="74" y="278" font-size="13.5" font-weight="600" fill="#9fd6f2">ADM e Financeiro  ·  Automação e IA</text>
</g>
<line x1="696" y1="180.0" x2="740" y2="180.0" stroke="#252e3b" stroke-width="2"/>
<line class="wire" x1="696" y1="180.0" x2="740" y2="180.0" stroke="#82cdf0" stroke-width="2.4" stroke-dasharray="44" stroke-dashoffset="44" style="animation-delay:0.8500000000000001s"/>
<circle class="pulse" cx="696" cy="180.0" r="3.6" fill="#9fd6f2" style="animation-delay:2.6s;--dx:44px"/><line x1="942" y1="180.0" x2="986" y2="180.0" stroke="#252e3b" stroke-width="2"/>
<line class="wire" x1="942" y1="180.0" x2="986" y2="180.0" stroke="#82cdf0" stroke-width="2.4" stroke-dasharray="44" stroke-dashoffset="44" style="animation-delay:1.55s"/>
<circle class="pulse" cx="942" cy="180.0" r="3.6" fill="#9fd6f2" style="animation-delay:3.2s;--dx:44px"/>
<g class="node" style="animation-delay:0.4s">
  <rect x="500" y="118" width="190" height="124" rx="16" fill="#121821" stroke="#252e3b" stroke-width="1.2"/>
  <circle cx="500" cy="180.0" r="5" fill="#0b0f15" stroke="#9fd6f2" stroke-width="1.6"/>
  <circle cx="690" cy="180.0" r="5" fill="#0b0f15" stroke="#9fd6f2" stroke-width="1.6"/>
  <text x="518" y="156" font-size="17.5" font-weight="700" fill="#eef3f8">Negócio</text>
  <text x="518" y="178" font-size="12.5" fill="#a2afc2">Administrativo e financeiro</text>
  <text x="518" y="216" font-size="12.5" font-weight="600" fill="#9fd6f2">Capex · Opex · SAP</text>
  <g class="ok" style="animation-delay:0.9s"><circle cx="672" cy="136" r="10" fill="#82cdf0"/><path d="M667 136 l3.5 3.5 l6.5 -7" fill="none" stroke="#0b0f15" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></g>
</g><g class="node" style="animation-delay:1.1s">
  <rect x="746" y="118" width="190" height="124" rx="16" fill="#121821" stroke="#252e3b" stroke-width="1.2"/>
  <circle cx="746" cy="180.0" r="5" fill="#0b0f15" stroke="#9fd6f2" stroke-width="1.6"/>
  <circle cx="936" cy="180.0" r="5" fill="#0b0f15" stroke="#9fd6f2" stroke-width="1.6"/>
  <text x="764" y="156" font-size="17.5" font-weight="700" fill="#eef3f8">Dados</text>
  <text x="764" y="178" font-size="12.5" fill="#a2afc2">Análise e indicadores</text>
  <text x="764" y="216" font-size="12.5" font-weight="600" fill="#9fd6f2">Excel · Power BI · SQL</text>
  <g class="ok" style="animation-delay:1.6s"><circle cx="918" cy="136" r="10" fill="#82cdf0"/><path d="M913 136 l3.5 3.5 l6.5 -7" fill="none" stroke="#0b0f15" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></g>
</g><g class="node" style="animation-delay:1.7999999999999998s">
  <rect x="992" y="118" width="190" height="124" rx="16" fill="#121821" stroke="#82cdf0" stroke-width="2"/>
  <circle cx="992" cy="180.0" r="5" fill="#0b0f15" stroke="#9fd6f2" stroke-width="1.6"/>
  <circle cx="1182" cy="180.0" r="5" fill="#0b0f15" stroke="#9fd6f2" stroke-width="1.6"/>
  <text x="1010" y="156" font-size="17.5" font-weight="700" fill="#eef3f8">Automação &amp; IA</text>
  <text x="1010" y="178" font-size="12.5" fill="#a2afc2">Menos trabalho manual</text>
  <text x="1010" y="216" font-size="12.5" font-weight="600" fill="#9fd6f2">n8n · Agentes · Claude</text>
  <g class="ok" style="animation-delay:2.3s"><circle cx="1164" cy="136" r="10" fill="#82cdf0"/><path d="M1159 136 l3.5 3.5 l6.5 -7" fill="none" stroke="#0b0f15" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></g>
